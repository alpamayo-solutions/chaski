name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  # The colca chaski is developed against: its data contracts and the broker of
  # the integration tests. colca v0.29.0: log forwarding by level, collapsed and
  # capped repeats, fetchLogs.
  COLCA_REF: 4b3be474c7d6afaf4b1ed50e4eb2205f918c422e

# A newer push to a pull request or to main supersedes the running checks. A
# release commit gets a group of its own, so its run (whose verdict the tag
# run reuses) always finishes; tag runs are never cancelled.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}${{ startsWith(github.event.head_commit.message, 'chore(main): release')
    && format('-release-{0}', github.sha) || '' }}
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main'
    && !startsWith(github.event.head_commit.message, 'chore(main): release')) }}

jobs:
  # A version tag points at a release commit whose push to main already ran
  # lint and the tests. The tag run waits for that run and reuses its verdict
  # rather than test the same commit again; without one it tests as usual.
  verified:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
    outputs:
      on-main: ${{ steps.main.outputs.passed }}
    steps:
      - id: main
        name: Checks of this commit on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs="repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=push&branch=main&head_sha=$GITHUB_SHA"
          deadline=$((SECONDS + 25 * 60))
          while :; do
            state=$(gh api "$runs" --jq '.workflow_runs
              | if any(.[]; .conclusion == "success") then "passed"
                elif any(.[]; .status != "completed") then "running"
                else "none" end')
            echo "ci on main for $GITHUB_SHA: $state"
            if [[ "$state" != running ]] || ((SECONDS > deadline)); then
              break
            fi
            sleep 20
          done
          if [[ "$state" == passed ]]; then passed=true; else passed=false; fi
          echo "passed=$passed" >> "$GITHUB_OUTPUT"

  lint:
    needs: [verified]
    if: ${{ !cancelled() && needs.verified.outputs.on-main != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: chaski
          fetch-depth: 0
      # chaski is developed against the data contracts of a colca checkout next to it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: alpamayo-solutions/colca
          ref: ${{ env.COLCA_REF }}
          path: colca
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.11.17"
      - name: ruff
        working-directory: chaski
        run: |
          uv run --group lint ruff check .
          uv run --group lint ruff format --check .
      - name: bandit
        working-directory: chaski
        run: uv run --group lint bandit -q -c pyproject.toml -r src
      - name: mypy
        working-directory: chaski
        run: uv run --extra dataops --group lint mypy src
      - name: shellcheck
        working-directory: chaski
        run: git ls-files -z '*.sh' | xargs -0 shellcheck
      - name: actionlint
        working-directory: chaski
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - name: yamllint
        working-directory: chaski
        run: git ls-files -z '*.yml' '*.yaml' | xargs -0 uvx yamllint@1.38.0 --strict
      - name: gitleaks
        working-directory: chaski
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0='*' zricethezav/gitleaks:v8.30.1 git /repo --redact --no-banner
      - name: No working notes in the tree
        working-directory: chaski
        run: scripts/check-no-working-notes.sh
      - name: No working notes in the commits of this pull request
        if: github.event_name == 'pull_request'
        working-directory: chaski
        run: scripts/check-no-working-notes.sh "origin/${{ github.base_ref }}"

  test:
    needs: [verified]
    if: ${{ !cancelled() && needs.verified.outputs.on-main != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: chaski
          # The merge commit and its base, to see what a pull request changes.
          fetch-depth: 2
      # A release pull request only moves the version and the changelog; the
      # release commit is tested on main, where the tag run reuses the verdict.
      # The job still runs, so the required check reports.
      - id: scope
        name: Release notes only
        working-directory: chaski
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          only=false
          if [[ "$GITHUB_EVENT_NAME" == pull_request && "$HEAD_REF" == release-please--* ]]; then
            changed=$(git diff --name-only HEAD^1 HEAD)
            echo "$changed"
            notes='^(CHANGELOG\.md|\.release-please-manifest\.json|version\.txt)$'
            if [[ -n "$changed" ]] && ! grep -qvE "$notes" <<< "$changed"; then
              only=true
            fi
          fi
          echo "release-notes-only=$only" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: steps.scope.outputs.release-notes-only != 'true'
        with:
          repository: alpamayo-solutions/colca
          ref: ${{ env.COLCA_REF }}
          path: colca
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        if: steps.scope.outputs.release-notes-only != 'true'
        with:
          version: "0.11.17"
      # The broker and its contracts bundle depend on nothing but the colca commit.
      - id: broker
        if: steps.scope.outputs.release-notes-only != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            colca/build/colcad
            colca/build/bundle/contracts-bundle.json
          key: colcad-${{ runner.os }}-${{ runner.arch }}-${{ env.COLCA_REF }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        if: steps.scope.outputs.release-notes-only != 'true' && steps.broker.outputs.cache-hit != 'true'
        with:
          go-version-file: colca/go.mod
          cache-dependency-path: colca/go.sum
      - name: Build broker for consumer conformance tests
        if: steps.scope.outputs.release-notes-only != 'true' && steps.broker.outputs.cache-hit != 'true'
        working-directory: colca
        run: |
          make bundle
          go build -o build/colcad ./cmd/colcad
      - name: Tests including broker reconnect and recovery
        if: steps.scope.outputs.release-notes-only != 'true'
        working-directory: chaski
        env:
          COLCAD_BINARY: ${{ github.workspace }}/colca/build/colcad
          COLCAD_CONTRACTS_BUNDLE: ${{ github.workspace }}/colca/build/bundle/contracts-bundle.json
        # Most of a test waits on a colcad process, so several run at once.
        run: >-
          uv run --python ${{ matrix.python-version }} --extra test
          pytest -n 6 --dist worksteal --durations=30

  # Pushes to main and version tags build the package once lint and tests pass;
  # a version tag also publishes a release.

  package:
    needs: [verified, lint, test]
    if: >-
      ${{ !cancelled() && github.event_name != 'pull_request' && (needs.verified.outputs.on-main == 'true'
      || (needs.lint.result == 'success' && needs.test.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.11.17"
      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME#v}"
            if [[ ! "$tag" =~ ^([0-9]+\.[0-9]+\.[0-9]+)(-rc\.([0-9]+))?$ ]]; then
              echo "::error::tag $GITHUB_REF_NAME is not vX.Y.Z or vX.Y.Z-rc.N"
              exit 1
            fi
            version="${BASH_REMATCH[1]}${BASH_REMATCH[3]:+rc${BASH_REMATCH[3]}}"
          else
            version="0.0.0.dev${GITHUB_RUN_NUMBER}+g${GITHUB_SHA::7}"
          fi
          uv version --frozen "$version"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Wheel and sdist
        run: uv build --out-dir dist
      - name: Check package metadata
        run: uvx twine@7.0.0 check --strict dist/*
      - id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          syft-version: v1.51.1
      - name: SBOM of the runtime dependencies
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          mkdir -p sbom
          uv export --frozen --no-dev --extra dataops --extra node --format cyclonedx1.5 -o sbom/chaski.cdx.json
          python3 - "$VERSION" <<'EOF'
          import json, sys
          path = "sbom/chaski.cdx.json"
          bom = json.load(open(path))
          bom["metadata"]["component"]["version"] = sys.argv[1]
          json.dump(bom, open(path, "w"), indent=2)
          EOF
          "$SYFT" convert sbom/chaski.cdx.json -o spdx-json=sbom/chaski.spdx.json
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        if: startsWith(github.ref, 'refs/tags/v') && github.event.repository.visibility == 'public'
        with:
          subject-path: dist/*
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e  # v4.1.0
        if: startsWith(github.ref, 'refs/tags/v') && github.event.repository.visibility == 'public'
        with:
          subject-path: dist/chaski-*.whl
          sbom-path: sbom/chaski.spdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: python-package
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom
          path: sbom/
          if-no-files-found: error

  release:
    needs: [package]
    # A skipped lint and test upstream would skip this job by default.
    if: ${{ !cancelled() && needs.package.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: python-package
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: sbom
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum -- * > SHA256SUMS)
          {
            echo "Install it from PyPI: \`pip install chaski\`, or \`pip install \"chaski[node]\"\` to embed a node."
            echo
            echo "An SBOM of the runtime dependencies is attached in SPDX and CycloneDX."
          } > assets.md
          # release-please normally created the release with its changelog; a tag pushed
          # by hand gets a new release with generated notes.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            body=$(gh release view "$GITHUB_REF_NAME" --json body --jq .body)
            if ! grep -q "Install it from PyPI" <<< "$body"; then
              printf '%s\n\n%s\n' "$body" "$(cat assets.md)" > notes.md
              gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
            fi
          else
            prerelease=()
            if [[ "$GITHUB_REF_NAME" == *-rc.* ]]; then
              prerelease=(--prerelease)
            fi
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "chaski $GITHUB_REF_NAME" \
              --notes-file assets.md --generate-notes "${prerelease[@]}"
          fi

  # Trusted publishing: PyPI accepts uploads from this workflow in the pypi
  # environment, so no token is stored anywhere.
  pypi:
    needs: [package]
    if: >-
      ${{ !cancelled() && needs.package.result == 'success' && startsWith(github.ref, 'refs/tags/v')
      && github.event.repository.visibility == 'public' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: python-package
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
