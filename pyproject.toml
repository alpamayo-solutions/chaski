[project]
name = "chaski"
version = "0.0.0"
description = "Speak to a Colca node, or be one: Edit, Service and Node, plus the chaski CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "keyring>=25,<27",
  "franzmq==0.6.3",
  "paho-mqtt==2.1.0",
  "ulid-py>=1.1",
  "pyyaml>=6.0",
  # chaski.Service's own external-identity minting (ed25519 key + self-signed
  # cert, mirroring colca-keygen -cert — SDK design §3.2).
  "cryptography>=42",
  # The door's HTTP client (chaski.door: /fetch, /ack, /kv, /publish) — the
  # consume lane behind Service.stream()/kv(), and what the shipped dataops
  # service imports (service families design 2026-09-07 §3.3, D7).
  "httpx>=0.27",
]

[project.scripts]
chaski = "chaski.cli:main"

[project.optional-dependencies]
test = [
  "pytest>=8.4,<10",
  # Local sibling package (not on PyPI); the published wheel bundles its
  # source instead (scripts/build_edit_client.py, matching how a
  # generated deployment's Docker build copies it too). Tests resolve it via [tool.uv.sources] below.
  "colca-data-contracts",
]
# `chaski[node]` (SDK design §6/§7 gap 5): the colcad binary, per platform,
# so `chaski.Node` needs no separate download or system install. Locally
# this resolves to colca/pywheel's bare SOURCE (see [tool.uv.sources] below)
# — importable, but with no `bin/colcad` inside, since only
# scripts/build_colcad_wheels.py's Go cross-compile actually populates that
# (chaski.Node._resolve_colcad_binary() checks the file exists before
# trusting it, and falls through to COLCAD_BINARY/PATH otherwise — local
# development and tests use COLCAD_BINARY). The version pin here is a
# placeholder matching colca/pywheel/pyproject.toml's own; the CI-built
# release wheel gets the real one, matching this exact release, from
# scripts/build_edit_client.py.
node = [
  "colcad==0.0.0",
]

[tool.uv.sources]
colca-data-contracts = { path = "../colca-data-contracts" }
colcad = { path = "../colca/pywheel" }

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
