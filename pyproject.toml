[project]
name = "chaski"
# Release builds take the version from the git tag.
version = "0.0.0"
description = "Publish to a Colca node, process its streams, or embed a node"
readme = "README.md"
license = { text = "FSL-1.1-ALv2" }
requires-python = ">=3.11"
dependencies = [
  "colca-data-contracts>=0.13,<0.19",
  "franzmq==0.6.5",
  "paho-mqtt==2.1.0",
  "ulid-py>=1.1",
  "pyyaml>=6.0",
  # A Service outside a deployment mints its own identity: an ed25519 key and
  # a self-signed certificate, like colca-keygen.
  "cryptography>=42",
  # The door's HTTP client: /fetch, /ack, /kv and /publish.
  "httpx>=0.27",
]

[project.optional-dependencies]
# What chaski.dataops (DataOpsService and the producer runtime) needs beyond the
# base package. No database driver: the historian is an interface a deployment
# implements, not something chaski opens.
dataops = [
  "apscheduler>=3.10,<4",
  "pandas>=2.1",
  "python-decouple>=3.8",
]
# The colcad binary for this platform. A local checkout resolves it to
# colca/pywheel, which has no binary; Node then looks at COLCAD_BINARY and PATH.
node = [
  "colcad>=0.13,<0.19",
]
test = [
  "pytest>=8.4,<10",
  "chaski[dataops]",
]

[project.urls]
Source = "https://github.com/alpamayo-solutions/chaski"
Colca = "https://github.com/alpamayo-solutions/colca"

[dependency-groups]
lint = [
  "ruff==0.16.6",
  "bandit==1.9.4",
  "mypy==2.3.1",
  "pandas-stubs==3.0.5.260730",
  "types-PyYAML==6.0.12.20260906",
]

# Development against a colca checkout next to this one.
[tool.uv.sources]
colca-data-contracts = { path = "../colca/contracts", editable = true }
colcad = { path = "../colca/pywheel" }

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120
# The examples in Markdown are laid out by hand.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "C4", "PIE", "RUF"]
# Line length is the formatter's job.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.bandit]
exclude_dirs = ["tests"]

[tool.mypy]
# numpy's stubs need 3.12 syntax; ruff keeps the code itself on 3.11.
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# These publish no type information; colcad is only installed with the node extra.
module = ["franzmq", "franzmq.*", "decouple", "apscheduler", "apscheduler.*", "colcad"]
ignore_missing_imports = true
